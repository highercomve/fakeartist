services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fakeartist:latest
    container_name: fakeartist
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-6060}:6060"
    environment:
      SERVER_PORT: "6060"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-json}"
      STORAGE_PATH: "/home/fakeartist/app/data"
      P2P_ENABLED: "${P2P_ENABLED:-true}"
      BUNDLE_DEV: "${BUNDLE_DEV:-false}"
      # Empty defaults → rooms.Manager built-ins (10m / 1m / 1m). Set
      # any of these (e.g. GC_IDLE_TTL=3s) to shrink the GC windows
      # for E2E tests without rebuilding the image.
      GC_IDLE_TTL: "${GC_IDLE_TTL:-}"
      GC_FINISHED_GRACE: "${GC_FINISHED_GRACE:-}"
      GC_SWEEP_INTERVAL: "${GC_SWEEP_INTERVAL:-}"
    volumes:
      - fakeartist-data:/home/fakeartist/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6060/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fakeartist-net

volumes:
  fakeartist-data:

networks:
  fakeartist-net:
    driver: bridge
